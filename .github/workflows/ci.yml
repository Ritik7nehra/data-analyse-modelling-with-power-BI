# Continuous integration: lint, test, run the pipeline end to end, execute the notebooks.
# STATUS: written and every command was run locally, but this workflow has not yet run on GitHub Actions.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev,deliverables]"
      - name: Lint
        run: ruff check . --exclude notebooks
      - name: Test
        run: pytest

  pipeline:
    name: Pipeline end to end (strict masking)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Create an ephemeral masking key for this run
        # Strict mode refuses to run without a key. This one exists only for the job and is never stored.
        run: echo "MASKING_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Run the pipeline (extract, validate, mask, load, model, reconcile, publish)
        run: python -m superstore_pipeline run --strict-masking
      - name: Show the data-quality gates
        run: python -m superstore_pipeline validate
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-run-evidence
          path: |
            build/data_quality_report.json
            build/pipeline_runs.jsonl
          if-no-files-found: error

  notebooks:
    name: Execute notebooks
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt nbconvert ipykernel
      - name: Execute the notebooks that ship with their data (Disney needs a CSV that is not in the repo)
        run: |
          mkdir -p "$RUNNER_TEMP/executed"
          for nb in superstore_sales_analysis nigeria_covid19_analysis; do
            jupyter nbconvert --to notebook --execute --output-dir "$RUNNER_TEMP/executed" "notebooks/$nb.ipynb"
          done
