[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superstore-pipeline"
version = "1.0.0"
description = "ETL pipeline, data masking, star-schema warehouse and BI marts for the Superstore sales data"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "duckdb>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "sqlglot>=25.0"]
analysis = ["matplotlib>=3.7", "seaborn>=0.13", "scipy>=1.10", "jupyterlab>=4.0"]
deliverables = ["openpyxl>=3.1", "python-pptx>=1.0", "matplotlib>=3.7"]
bigquery = ["google-cloud-bigquery>=3.20", "pyarrow>=15"]
pbix = ["pbixray"]

[project.scripts]
superstore-pipeline = "superstore_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:MASKING_KEY is not set:UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"excel/*" = ["E501"]          # workbook builders contain long layout/label strings
"excel/finance/*" = ["E501"]
