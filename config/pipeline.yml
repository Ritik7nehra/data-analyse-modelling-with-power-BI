# Pipeline configuration. Paths are relative to the repository root.

source:
  orders_csv: data/superstore_orders.csv

warehouse:
  duckdb_path: build/superstore.duckdb
  models_dir: warehouse/duckdb/models

outputs:
  marts_dir: reports/marts          # BI-ready CSV exports of every mart_* table
  run_log: build/pipeline_runs.jsonl
  dq_report: build/data_quality_report.json

masking:
  key_env: MASKING_KEY              # secret HMAC key; set it in the environment (CI secret in production)
  postal_prefix_len: 3              # postal codes are generalised to this many leading digits

quality:
  # Control totals from the source system (the Power BI report). The pipeline stops if the loaded fact
  # table does not reconcile to them.
  control_totals:
    row_count: 9994
    sales: 2297200.86
    profit: 286397.02
    tolerance: 0.01
